<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDI-HACK - Agenda del Doctor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="CSS/cita_doc.css">
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 sidebar">
        <div class="logo-section text-center py-4">
          <h2 class="text-white">MEDI-HACK</h2>
          <p class="text-light">Panel del Doctor</p>
        </div>
        <div class="menu-options">
          <h5 class="section-title">Opciones</h5>
          <div class="nav flex-column nav-pills">
            <a class="nav-link active"><i class="fas fa-calendar-alt me-2"></i> Mi Agenda</a>
            <a class="nav-link"><i class="fas fa-user-clock me-2"></i> Solicitudes</a>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-md-9 main-content">
        <div class="header-bar p-3">
          <h4 class="mb-0">Agenda de Citas</h4>
        </div>

        <div class="content-area p-4">
          <div class="row">
            <!-- Calendario -->
            <div class="col-md-6">
              <h5 class="section-title">Definir Disponibilidad</h5>
              <div class="calendar-container">
                <div class="calendar" id="calendar">
                  <div class="calendar-header">
                    <button class="btn btn-sm btn-outline-secondary" id="prev-month"><i class="fas fa-chevron-left"></i></button>
                    <h6 id="current-month">Mes Año</h6>
                    <button class="btn btn-sm btn-outline-secondary" id="next-month"><i class="fas fa-chevron-right"></i></button>
                  </div>
                  <div class="calendar-grid" id="calendar-days"></div>
                </div>
                <div class="mt-3">
                  <label class="form-label">Horario disponible</label>
                  <select id="hora-disponible" class="form-select">
                    <option>08:00 AM</option>
                    <option>09:00 AM</option>
                    <option>10:00 AM</option>
                    <option>11:00 AM</option>
                    <option>02:00 PM</option>
                    <option>03:00 PM</option>
                  </select>
                  <button class="btn btn-primary mt-2" id="guardar-disponibilidad">
                    <i class="fas fa-save me-1"></i> Guardar Disponibilidad
                  </button>
                </div>
                <ul id="horasLista" class="list-group mt-3"></ul>
              </div>
            </div>

            <!-- Solicitudes -->
            <div class="col-md-6">
              <h5 class="section-title">Solicitudes de Pacientes</h5>
              <div class="appointments-table">
                <table class="table table-striped" id="tabla-solicitudes">
                  <thead>
                    <tr>
                      <th>Paciente</th>
                      <th>Fecha</th>
                      <th>Hora</th>
                      <th>Estado</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div> 
        </div>
      </div>
    </div>
  </div>

  <script src="JavaScript/cit_doc.js"></script>
</body>
</html>
