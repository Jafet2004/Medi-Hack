<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDI-HACK - Registro de Trabajadores de Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/register.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <img src="IMG/Medi-hack_logo.jpg" alt="MEDI-HACK Logo" class="mb-3" height="100"
                                width="100">
                            <h2 class="card-title text-primary">MEDI-HACK</h2>
                            <p class="text-muted">Registro de trabajadores de salud</p>
                        </div>

                        <form id="registerFormTrab">
                            <!-- Foto de perfil -->
                            <!--
                            <div class="text-center mb-4">
                                <div class="profile-picture-container">
                                    <div class="profile-picture-placeholder">
                                        <i class="fas fa-user fa-3x"></i>
                                    </div>
                                    <input type="file" id="foto" accept="image/*">
                                </div>
                                <small class="text-muted">Haga clic para subir una foto</small>
                            </div>
                            -->

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="primer_nombre" class="form-label">Primer Nombre *</label>
                                    <input type="text" class="form-control" id="primer_nombre" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="segundo_nombre" class="form-label">Segundo Nombre</label>
                                    <input type="text" class="form-control" id="segundo_nombre">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="primer_apellido" class="form-label">Primer Apellido *</label>
                                    <input type="text" class="form-control" id="primer_apellido" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="segundo_apellido" class="form-label">Segundo Apellido</label>
                                    <input type="text" class="form-control" id="segundo_apellido">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="cedula" class="form-label">Cédula *</label>
                                    <input type="text" class="form-control" id="cedula" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="codigo_minsa" class="form-label">Código de MINSA *</label>
                                    <input type="text" class="form-control" id="codigo_minsa" required>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="especialidad" class="form-label">Especialidad *</label>
                                <select class="form-select" id="especialidad" required>
                                    <option value="">Seleccione una especialidad</option>
                                    <option value="Cirugia general">Cirugía General</option>
                                    <option value="pediatria">Pediatría</option>
                                    <option value="Ginecologia y obstetricia">Ginecología y Obstetricia</option>
                                    <option value="cardiologia">Cardiología</option>
                                    <option value="Dermatologia">Dermatología</option>
                                    <option value="Medicina Interna">Medicina Interna</option>
                                    <option value="Urologia">Urología</option>
                                    <option value="Otorrinolaringologia">Otorrinolaringología</option>
                                    <option value="Oftalmologia">Oftalmología</option>
                                    <option value="Radiologia">Radiología</option>
                                    <option value="Psiquiatria">Psiquiatría</option>
                                </select>
                            </div>


                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico *</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">Contraseña *</label>
                                    <input type="password" class="form-control" id="password" required>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="confirmPassword" class="form-label">Confirmar contraseña *</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Registrarse</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">¿Ya tienes una cuenta? <a href="login.html"
                                    class="text-decoration-none">Inicia sesión aquí</a></p>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="JavaScript/reg_trab.js"></script>
</body>

</html>
